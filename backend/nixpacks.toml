[phases.setup]
nixPkgs = ["nodejs_20"]

# --include=dev forces devDependencies (typescript, @types) to install even when
# NODE_ENV=production is set on Railway — otherwise tsc is missing and the build fails.
[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
